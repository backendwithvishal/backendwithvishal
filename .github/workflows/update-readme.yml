name: Update README

on:
  schedule:
    # Runs every day at 03:00 UTC (~8:30 AM IST). Change the cron if you want a different time.
    - cron: '0 3 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    paths:
      - '.github/workflows/update-readme.yml'
      - 'scripts/update-readme.js'
      - 'package.json'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Update README sections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: backendwithvishal
          BLOG_RSS_URL: ${{ secrets.BLOG_RSS_URL }}   # optional, set in repo Settings > Secrets
        run: node scripts/update-readme.js

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: auto-update README [skip ci]'
          file_pattern: README.md
